# =============================================================================
# TASK GRAPH
#
# Every task: id, phase, name, depends_on, estimate_hours, risk_tier, files,
# acceptance criteria, ssot_updates.
#
# ACCEPTANCE CRITERIA ARE TEST NAMES, NOT ASPIRATIONS (ADR-016). Each one maps
# to a named test written BEFORE the implementation. A task with an untested
# acceptance criterion is not done.
#
# risk_tier drives which review gates apply and whether an agent may merge
# autonomously (ADR-021). Tier 3 ALWAYS requires a human.
#
# A missing task is work that silently doesn't happen. Add rather than assume.
# =============================================================================

version: 1

# =============================================================================
phase_P0:
# =============================================================================

  - id: P0.1
    phase: P0
    name: Monorepo skeleton
    depends_on: []
    estimate_hours: 5
    risk_tier: 1
    files:
      - package.json
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - packages/config/
      - .gitignore
      - .env.example
    acceptance:
      - "pnpm install && pnpm -r typecheck passes on an empty tree"
      - "Every apps/* and packages/* directory from CONVENTIONS.md exists with a package.json"
      - "Root tsconfig sets strict, noUncheckedIndexedAccess and exactOptionalPropertyTypes"
      - "ESLint rejects an `any`, a cross-package relative import, and a Discord snowflake literal"
      - ".env.example contains placeholders only — gitleaks finds no secret"
    ssot_updates: [STATUS.md]

  - id: P0.2
    phase: P0
    name: Database up, schema copied from the SSOT
    depends_on: [P0.1]
    estimate_hours: 4
    risk_tier: 2
    files:
      - infra/docker/compose.dev.yml
      - packages/db/prisma/schema.prisma
      - packages/db/prisma/migrations/
      - packages/db/src/client.ts
    acceptance:
      - "packages/db/prisma/schema.prisma is BYTE-IDENTICAL to ssot/03-data/schema.prisma"
      - "pnpm db:migrate:dev creates all 56 tables; psql \\dt lists them"
      - "Every hand-written index in ssot/03-data/indexes.md exists — asserted by a query against pg_indexes"
      - "citext, cube, vector, pgcrypto AND timescaledb extensions are installed"
      - "The image is timescale/timescaledb-ha:pg16 - stock pgvector/pgvector lacks TimescaleDB and stock timescaledb lacks pgvector (decision D10)"
      - "market_history is a hypertable with a 7-day compression policy and a 90-day retention policy"
      - "The partial unique index on cmdr_verifications rejects a second active claim (INV-005)"
      - "The tsvector generated column on forum_posts populates on insert"
    notes: >
      COPY the schema, do not rewrite it. Rewriting is immediate SSOT drift and is
      the single most common P0 failure.
    ssot_updates: [STATUS.md]

  - id: P0.3
    phase: P0
    name: Shared contracts package
    depends_on: [P0.1]
    estimate_hours: 6
    risk_tier: 2
    files:
      - packages/shared/src/permissions.ts
      - packages/shared/src/errors.ts
      - packages/shared/src/dto/
      - packages/shared/src/permissions.spec.ts
    acceptance:
      - "packages/shared/src/permissions.ts is BYTE-IDENTICAL to ssot/04-contracts/permissions.ts"
      - "hasPermission round-trips SITE_CONFIG (1n<<63n) through storage and JSON exactly (INV-006)"
      - "computeEffectiveMask proves deny beats grant for every permission group (INV-007)"
      - "maskToString never emits a JSON number"
      - "Error envelope matches ssot/04-contracts/errors.md exactly"
      - "Zod DTOs exist for every schema referenced by openapi.yaml"
    ssot_updates: [STATUS.md]

  - id: P0.4
    phase: P0
    name: API skeleton with health
    depends_on: [P0.2, P0.3]
    estimate_hours: 6
    risk_tier: 2
    files:
      - apps/api/src/main.ts
      - apps/api/src/health/
      - apps/api/src/common/exception.filter.ts
      - apps/api/src/common/zod-validation.pipe.ts
    acceptance:
      - "GET /v1/health returns status, version and real connectivity checks for db, redis and meilisearch"
      - "Killing redis makes /v1/health report degraded with HTTP 200, NOT a 500"
      - "Killing postgres makes it report down with HTTP 503"
      - "An unhandled exception produces the error envelope with a requestId and no stack trace"
      - "Pino logs carry a requestId correlated across the request"
      - "A Zod validation failure enumerates EVERY failing field, not just the first"
    ssot_updates: [STATUS.md]

  - id: P0.5
    phase: P0
    name: Web skeleton and design tokens
    depends_on: [P0.1]
    estimate_hours: 6
    risk_tier: 1
    files:
      - apps/web/app/layout.tsx
      - apps/web/app/page.tsx
      - apps/web/tailwind.config.ts
      - tools/tokens-to-tailwind.ts
    acceptance:
      - "The Tailwind theme is generated from ssot/07-design/tokens.json; regenerating produces no diff"
      - "Landing hero renders; Lighthouse accessibility >= 95"
      - "prefers-reduced-motion removes all animation, the scanline and the boot sequence"
      - "prefers-contrast: more switches to the high-contrast theme"
      - "The Frontier attribution notice is present in the footer (INV-029)"
      - "No forbidden colour pair from accessibility.md appears in the rendered output"
    ssot_updates: [STATUS.md]

  - id: P0.6
    phase: P0
    name: CI pipeline
    depends_on: [P0.3, P0.4, P0.5]
    estimate_hours: 7
    risk_tier: 2
    files:
      - .github/workflows/pr.yml
      - .github/workflows/main.yml
      - tools/ssot-drift-check.ts
      - tools/contrast-check.ts
    acceptance:
      - "PR pipeline runs lint, typecheck, unit, integration, invariants, coverage, ssot-drift, contract, secret-scan, audit, Trivy and build"
      - "A deliberately-failing PR is blocked"
      - "MANDATORY: branch protection on main is updated to REQUIRE these checks. Until this runs, protection requires a PR but verifies nothing — `CI green` is a convention, not a merge precondition. Command in 10-quality/git-workflow.md"
      - "Editing packages/db/prisma/schema.prisma alone FAILS the ssot-drift check"
      - "Editing packages/shared/src/permissions.ts alone FAILS the ssot-drift check"
      - "Changing a token so a contrast pair drops below AA FAILS the contrast check"
      - "A committed fake secret FAILS gitleaks"
      - "Trivy runs AFTER build and scans the image this PR produced, not a cached earlier one"
      - "integration and invariants share one database spin-up; the full pipeline completes in under 10 minutes"
      - "An invariant with no @INV-nnn tagged test FAILS the invariant job"
    notes: The SSOT-drift check is the mechanism the whole SSOT model depends on. Test that it actually fails.
    ssot_updates: [STATUS.md]

  - id: P0.7
    phase: P0
    name: Production deploy
    depends_on: [P0.6]
    estimate_hours: 6
    risk_tier: 3
    files:
      - infra/docker/compose.prod.yml
      - infra/caddy/Caddyfile
      - .github/workflows/deploy.yml
    acceptance:
      - "The landing page loads over HTTPS at the real domain"
      - "/v1/health returns all-green in production"
      - "Caddy obtains and renews a certificate automatically"
      - "Production deploy requires the manual gate; staging does not"
      - "A failed post-deploy health check triggers automatic rollback"
      - "Every container carries an explicit mem_limit per 00-charter/constraints.md; a container without one fails the compose lint"
      - "The staging deploy step checks free memory FIRST and refuses below 1.5 GB — an autonomous staging deploy must not let the OOM killer take production Postgres"
      - "redis uses maxmemory-policy noeviction; evicting a BullMQ queue silently drops ACL re-index jobs"
      - "No secret is present in any image layer — verified by scanning the built image"
    blocked_by_decisions: [D1, D6]
    ssot_updates: [STATUS.md]

  - id: P0.8
    phase: P0
    name: Quality harness — TDD, invariants and review-gate tooling
    depends_on: [P0.6]
    estimate_hours: 5
    risk_tier: 2
    files:
      - vitest.config.ts
      - tools/invariant-coverage.ts
      - ssot/10-quality/review-log.md
      - .github/pull_request_template.md
    acceptance:
      - "pnpm test:invariants runs only @INV-nnn tagged tests and reports coverage against invariants.md"
      - "invariant-coverage reads the `due:Pn` marker on each invariant and requires a tagged test ONLY for invariants due by the phase recorded in STATUS.md"
      - "invariant-coverage FAILS on an invariant with no `due:` marker, and on one that is past due and untested"
      - "The job prints `N due / N covered · M not yet due (…)` — a not-yet-due invariant is never reported as a pass"
      - "Coverage gates from 10-quality/test-strategy.md are enforced per package"
      - "The PR template requires the task ID, acceptance-to-test mapping, review-gate table and risk tier"
      - "A tier-1 claim on a path in the tier-3 floor list is rejected by CI (ADR-021)"
    ssot_updates: [STATUS.md, 10-quality/review-log.md]

# =============================================================================
phase_P1:
# =============================================================================

  - id: P1.1
    phase: P1
    name: Discord OAuth
    depends_on: [P0.4, P0.8]
    estimate_hours: 7
    risk_tier: 3
    files:
      - apps/api/src/auth/discord.controller.ts
      - apps/api/src/auth/discord.service.ts
      - packages/ed-clients/src/discord/discord.adapter.ts
      - packages/ed-clients/src/discord/discord.fake.ts
    acceptance:
      - "A Discord login round-trip creates a users row and a discord_identities row"
      - "guild_roles is populated from /users/@me/guilds/{id}/member"
      - "Scopes requested are exactly identify and guilds.members.read"
      - "The `email` scope is NOT requested and no email address is ever read or stored"
      - "A user not in our guild is refused with DISCORD_GUILD_MEMBERSHIP_REQUIRED"
      - "OAuth tokens are stored AES-256-GCM encrypted; the raw column contains no plaintext (INV-012)"
      - "The redirect parameter is validated against an internal-path allowlist — an external URL is rejected"
      - "Integration test passes against the fake adapter with no network access"
    blocked_by_decisions: [D2]
    notes: >
      The `email` scope was REMOVED from this task on 2026-07-26. Decision D11 built
      no email channel at all, so an address obtained here could never be used for
      anything — it would be PII collected for no purpose, stored, backed up and
      breached for no benefit. Data minimisation is cheaper than data protection.
      Dropping it also narrows the consent screen, which raises signup conversion.
      If an email channel is ever revived, this scope and INV-027 come back together.
    ssot_updates: [STATUS.md]

  - id: P1.2
    phase: P1
    name: Sessions with rotating refresh and reuse detection
    depends_on: [P1.1]
    estimate_hours: 8
    risk_tier: 3
    files:
      - apps/api/src/auth/session.service.ts
      - apps/api/src/auth/refresh.guard.ts
      - apps/api/src/common/csrf.middleware.ts
    acceptance:
      - "Access JWT is 15 minutes; refresh is 30 days and rotates on every use"
      - "MANDATORY: replaying an already-used refresh token revokes the ENTIRE family and every session for that device"
      - "Cookies are HttpOnly, Secure, SameSite=Lax and __Host- prefixed"
      - "A state-changing request without a valid CSRF double-submit token is rejected"
      - "Refresh tokens are stored as SHA-256 hashes; the plaintext is never persisted"
      - "A revoked family's tokens are refused even before natural expiry"
      - "MANDATORY: idempotency keys are namespaced (userId, endpoint, key). A member presenting an officer's key with an identical body does NOT receive the officer's stored response, and the permission guard executes normally (INV-041)"
    ssot_updates: [STATUS.md]

  - id: P1.3
    phase: P1
    name: Permission engine with data-layer enforcement
    depends_on: [P0.3, P1.2]
    estimate_hours: 8
    risk_tier: 3
    files:
      - apps/api/src/authz/permission.service.ts
      - apps/api/src/authz/requires-permission.guard.ts
      - packages/db/src/acl-extension.ts
    acceptance:
      - "Effective mask = OR(role masks) AND NOT deny_mask, and nothing else grants (INV-001)"
      - "MANDATORY: a Ring 0 principal calling the REPOSITORY DIRECTLY, bypassing every controller and guard, cannot retrieve a Ring 1 row (INV-002)"
      - "Negative tests exist for every ring boundary in both directions"
      - "Redis cache perm:{userId} has a 5-minute TTL and is busted on every role, mapping, bundle and deny-mask change"
      - "A model with an ACL that is not registered with the extension FAILS a test that enumerates ACL-bearing models"
      - "MANDATORY: computeEffectiveMask takes account status. A user whose status is left, banned or inactive resolves to NO_PERMISSIONS even with surviving `manual` role grants (INV-037)"
      - "guildMemberRemove and any users.status change bust perm:{userId} and drop that user's WebSocket channels"
      - "Ownership predicates (own loadout, own carrier, own applicant thread) are enforced in the same layer"
      - "The applicant's ownership predicate reaches ONLY their applicantThreadId — never the Ring 2 deliberationThreadId (INV-002)"
    notes: >
      The single most important task in P1. Controller guards alone are the exact leak
      INV-002 exists to prevent.
    ssot_updates: [STATUS.md]

  - id: P1.4
    phase: P1
    name: Discord role-sync bot
    depends_on: [P1.3]
    estimate_hours: 7
    risk_tier: 3
    files:
      - apps/bot/src/main.ts
      - apps/bot/src/handlers/guild-member.ts
      - apps/bot/src/handlers/role-update.ts
    acceptance:
      - "A role change in Discord is reflected on the site within 5 seconds"
      - "guildMemberAdd creates the user and assigns applicant"
      - "guildMemberUpdate diffs roles, busts perm:{userId} and writes an audit row"
      - "guildMemberRemove soft-deactivates and revokes sessions but RETAINS content"
      - "roleUpdate or roleDelete on a MAPPED role alerts admins rather than silently stripping permissions"
      - "Every role change produces an audit_log row with before/after (INV-009)"
      - "No Discord snowflake literal appears in application source (INV-008)"
    blocked_by_decisions: [D2]
    ssot_updates: [STATUS.md]

  - id: P1.5
    phase: P1
    name: Nightly reconciliation
    depends_on: [P1.4]
    estimate_hours: 4
    risk_tier: 2
    files:
      - apps/worker/src/jobs/discord-reconcile.ts
    acceptance:
      - "A full guild member fetch diffs against the DB and repairs drift"
      - "Manually corrupting a guild_roles row is repaired by the job and reported"
      - "manual-sourced role grants SURVIVE reconciliation; discord-sourced ones do not"
      - "Anomalies are reported to the Discord admin channel with specifics, not a count"
      - "The job is idempotent — a second run in the same minute changes nothing"
    ssot_updates: [STATUS.md]

  - id: P1.6
    phase: P1
    name: Member profiles and privacy
    depends_on: [P1.3]
    estimate_hours: 7
    risk_tier: 3
    files:
      - apps/api/src/members/
      - apps/web/app/members/[handle]/page.tsx
      - apps/web/app/settings/privacy/page.tsx
    acceptance:
      - "MANDATORY: a privacy toggle set to private makes the field ABSENT from the public API response, not null and not merely hidden by the UI (INV-027)"
      - "All privacy defaults are conservative — telemetry consent is empty, every show* flag is false"
      - "The device/session list shows every active family and revokes individually"
      - "Revoking a session makes the next request 401"
      - "A member can export everything held about them as JSON"
    blocked_by_decisions: [D13]
    ssot_updates: [STATUS.md]

  - id: P1.7
    phase: P1
    name: Admin console v1
    depends_on: [P1.3, P1.6]
    estimate_hours: 8
    risk_tier: 3
    files:
      - apps/api/src/admin/
      - apps/web/app/admin/
    acceptance:
      - "Every admin action appears in audit_log with before/after diffs (INV-009)"
      - "The role editor shows a live who-does-this-affect preview listing exactly which members gain or lose which permissions BEFORE saving"
      - "The Discord mapping editor is the only path by which snowflakes enter the system"
      - "Saving a role or mapping busts every affected permission cache"
      - "The audit log viewer filters by actor, action, target and date"
      - "A non-officer receives 404, not 403, on every admin route"
    ssot_updates: [STATUS.md]

  # SUPERSEDED BY ADR-022 (2026-07-27). Frontier cAPI is off the critical path
  # permanently: the journals give us everything it would, in real time, without
  # a discretionary approval that has never been applied for. This task remains
  # recorded rather than deleted because cAPI would still be a genuine UPGRADE
  # (trust tier 3 is Frontier's own attestation, which nothing else can give) —
  # it is simply no longer something anything waits on.
  - id: P1.8
    phase: P1
    name: Frontier cAPI verification
    status: superseded
    superseded_by: [P1.11, P1.8b]
    depends_on: [P1.6]
    estimate_hours: 8
    risk_tier: 3
    conditional: only if cAPI approval has arrived, and never blocking
    files:
      - apps/api/src/auth/frontier.controller.ts
      - packages/ed-clients/src/frontier/capi.adapter.ts
      - apps/worker/src/jobs/capi-lifecycle.ts
    acceptance:
      - "PKCE S256; the verifier lives in Redis at 10-minute TTL and a code is never accepted without it"
      - "GET /profile yields the authoritative CMDR name and a trust_tier 3 verification"
      - "HTTP 422 from cAPI is handled as token-expired, not as a generic client error"
      - "Refresh and access tokens are encrypted at rest and unreadable as plaintext in the column (INV-012)"
      - "expiresAt is set to verifiedAt + 25 days"
      - "The worker DMs at day 20 and downgrades to stale at day 25, RETAINING read access"
      - "A second active verification for the same CMDR name is rejected (INV-005)"
      - "No request path performs a synchronous cAPI call (INV-031)"
    blocked_by_decisions: []
    external_blockers: [capi_approval]
    ssot_updates: [STATUS.md]

  - id: P1.8b
    phase: P1
    name: Fallback CMDR verification — Inara nonce and officer manual
    depends_on: [P1.6]
    estimate_hours: 6
    risk_tier: 3
    files:
      - apps/api/src/auth/claim-verification.controller.ts
      - packages/ed-clients/src/inara/inara.adapter.ts
      - apps/worker/src/jobs/inara-nonce-poll.ts
    acceptance:
      - "A nonce is issued, has a TTL, and expires to VERIFICATION_NONCE_EXPIRED"
      - "The worker polls Inara and grants trust_tier 2 when the nonce is found in the profile"
      - "Nonce-not-found-yet is a NORMAL in-progress state, not an error"
      - "MANDATORY: an abandoned pending claim does NOT block the real CMDR owner from verifying. The uniqueness lock applies only to isVerified rows, and pending claims expire by nonceExpiresAt (INV-005, RED-TEAM R7)"
      - "Officer manual approval grants trust_tier 1 and is audited"
      - "The Inara adapter dispatches at most 2 requests/minute GLOBALLY through one shared limiter (INV-033)"
      - "events[0].eventStatus is checked, not merely the HTTP status"
      - "Inara being unavailable or unapproved degrades this path only — nothing else breaks"
    notes: >
      SHIPS REGARDLESS OF WHETHER cAPI APPROVAL ARRIVES. Do not block the phase on
      a third party's discretion.
    ssot_updates: [STATUS.md]

  - id: P1.10
    phase: P1
    name: Mandatory TOTP 2FA for officers and above
    depends_on: [P1.2, P1.3]
    estimate_hours: 6
    risk_tier: 3
    files:
      - apps/api/src/auth/totp.service.ts
      - apps/api/src/auth/totp.controller.ts
      - apps/web/app/settings/security/page.tsx
    acceptance:
      - "An account holding FORUM_VIEW_OFFICER or above cannot perform a privileged action until TOTP is enrolled - enrolment is forced, not suggested"
      - "Enrolment issues single-use recovery codes, displayed ONCE and stored hashed"
      - "MANDATORY: TOTP secrets and recovery codes are encrypted at rest and never appear in logs or API responses (INV-012)"
      - "A tier-3 action (role grant, site config, AI kill switch) requires a fresh step-up challenge even within a live session"
      - "TOTP verification is rate-limited and locks out after repeated failure - an unthrottled 6-digit code is brute-forceable"
      - "Replaying a previously-used TOTP code within its window is REJECTED"
      - "Losing the device is recoverable by a sysadmin, and that recovery is audited"
    notes: >
      Built in P1 rather than deferred (decision D13). Officers can moderate, set BGS orders,
      manage members and read the audit log - Discord OAuth alone means a compromised Discord
      account is a compromised officer account. Retrofitting auth is always worse than building
      it in.
    ssot_updates: [STATUS.md]

  - id: P1.11
    phase: P1
    name: Electron companion app — journal collection
    depends_on: [P1.6, P1.8b]
    estimate_hours: 20
    risk_tier: 3
    decision: ADR-022, D27
    files:
      - apps/companion/
      - apps/api/src/telemetry/journal.controller.ts
      - apps/api/src/telemetry/pairing.service.ts
    acceptance:
      - "MANDATORY: the app is OPTIONAL — every feature of the website works without it, and a member who never installs it can hold any rank"
      - "A journal session event sets game_activity to `observed` for that month, which is what unblocks promotion"
      - "Pairing uses a single-use token issued from an authenticated web session; the token is hashed at rest and cannot be replayed"
      - "MANDATORY: the app reads ONLY the journal directory and posts only to our own ingest endpoint — no EDDN upload, no other filesystem access"
      - "An Inara key added in the app is the same record as one added on the web, distinguished only by `source`"
      - "Ingest is idempotent per (member, journal file, event offset): a re-sent batch after a crash creates no duplicate activity"
      - "The app works offline — events queue locally and flush when the API is reachable"
      - "No credential is written to disk in plaintext, including the pairing token and the Inara key"
    notes: >
      ELECTRON, non-negotiable per D27. The app WRAPS the existing web frontend
      rather than reimplementing it. It is not a market client: market data
      comes from EDDN via apps/eddn-collector, and uploading to EDDN would take
      on a data-quality obligation to the whole community for no benefit to us.
    ssot_updates: [STATUS.md]

  - id: P1.9
    phase: P1
    name: Public landing with live stats
    depends_on: [P1.6, P0.5]
    estimate_hours: 6
    risk_tier: 2
    files:
      - apps/web/app/(public)/page.tsx
      - apps/api/src/public/stats.controller.ts
      - packages/ed-clients/src/galnet/galnet.adapter.ts
    acceptance:
      - "Loads in under 1.5 seconds; Lighthouse accessibility >= 95"
      - "Stats come from our own database, not a third party"
      - "Only members who opted in appear on the public roster or leaderboard (INV-027)"
      - "GalNet unavailable omits the section entirely rather than rendering a broken panel"
      - "Zeroed counters are suppressed rather than displaying '0 COMMANDERS'"
    blocked_by_decisions: [D12]
    ssot_updates: [STATUS.md]

# =============================================================================
phase_P2:
# =============================================================================

  # ===========================================================================
  # ★ P2.0 EXISTS BECAUSE P1.3 WAS CLAIMED DONE AND ITS CENTRAL CONTROL WAS NOT
  #   APPLIED. Found by the P1 exit panel, 2026-07-29 (finding P1-1).
  #
  #   The ACL extension in packages/db is written, works, and has an integration
  #   test — and `withPrincipal` has ZERO callers in apps/. So INV-002 has been
  #   reported as covered while nothing enforced it. No data leaked, because
  #   every ACL-bearing table is empty and belongs to a later phase.
  #
  #   P2.1 already says "all queries go through the P1.3 data-layer filter". That
  #   sentence assumed a filter that is not bound to anything, which is precisely
  #   how the gap survived. This task makes the binding a deliverable with its own
  #   acceptance rather than an assumption inside somebody else's.
  # ===========================================================================
  - id: P2.0
    phase: P2
    name: Bind the data-layer ACL — INV-002, a hard gate on all of P2
    depends_on: []
    estimate_hours: 5
    risk_tier: 3
    files:
      - packages/db/src/acl-extension.ts
      - apps/api/src/database.module.ts
      - apps/api/src/authz/principal.provider.ts
    acceptance:
      - "MANDATORY: `withPrincipal` is applied to every read of an ACL-bearing model; a repository test calls the APPLICATION's repository as a Ring 0 principal and asserts zero Ring 1 rows"
      - "INV-002's test no longer calls the extension directly — the old integration test proved the extension works when applied, which is the thing that was never in doubt"
      - "A static check fails the build if a Prisma client reaching an ACL-bearing model is constructed without a principal"
      - "The principal is derived from the SESSION, never from a request parameter — a caller cannot nominate their own mask"
      - "ANONYMOUS is the default when no session is present, not a bypass"
      - "`assertAclModelsRegistered` runs in CI against the real schema (already true — keep it true)"
      - "Removing the binding makes at least one test fail; proven by reverting it, not assumed"
    blocked_by_decisions: []
    ssot_updates: [STATUS.md, 02-domain/invariants.md, 10-quality/review-log.md]

  - id: P2.1
    phase: P2
    name: Category and thread CRUD
    depends_on: [P1.3, P2.0]
    estimate_hours: 7
    risk_tier: 3
    files:
      - apps/api/src/forum/category.service.ts
      - apps/api/src/forum/thread.service.ts
    acceptance:
      - "MANDATORY: a Ring 0 user listing categories cannot see, COUNT, or infer the existence of Ring 1 categories"

# =============================================================================
graph_rules:
# =============================================================================
  - Every depends_on must resolve to a task id in this file.
  - A task may not depend on a task in a later phase, with one deliberate exception: P5.2 and P5.4 depend on P7.8 because the wing composition checker needs fleet queries. If P5 is reached before P7, P7.8 is pulled forward as a standalone task and recorded here.
  - Tasks are 2-8 hours. A larger estimate means the task is really several and should be split before starting.
  - "risk_tier 3 ALWAYS requires a human to merge (ADR-021)."
  - Acceptance criteria are test names. A task with an untested criterion is not done (ADR-016).
  - Tasks marked MANDATORY in their acceptance criteria are phase-exit gates and cannot be deferred.

# Discord role mappings — GENERATED FROM THE LIVE GUILD, 2026-07-26.
#
# Read from the Discord API rather than transcribed by hand, so the names and
# IDs here are exactly what the server has. IDs are DATA, never hard-coded in
# application source (INV-008) — renaming a role in Discord changes nothing.
# Deleting and recreating one mints a NEW id and DOES break the mapping.
#
# The bot is READ-ONLY with respect to roles (human decision, 2026-07-26).
# Leadership assigns every rank by hand in Discord; the site mirrors what it
# finds. Discord is the source of truth for who holds what.
#
# Tenure and loyalty ranks grant NO permissions (INV-046). They are titles.
# Only reserved and leadership roles map to a permission bundle.


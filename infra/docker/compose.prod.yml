name: grims

# Production stack. Run from the repo root on the server:
#   docker compose --env-file /srv/grims/.env -f infra/docker/compose.prod.yml up -d
#
# Note what is NOT published to the host: Postgres, Redis and Meilisearch have
# no `ports:` mapping at all. They are reachable only from inside the compose
# network. A database bound to 0.0.0.0 on a public IP is found by scanners in
# hours, and the Vultr firewall would be the only thing between it and the
# internet — one accidental rule edit away from a breach.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      # ★ THE DIRECTORY, NOT THE FILE ★
      #
      # This mounted `../caddy/Caddyfile` directly. Bind-mounting a single FILE
      # pins an INODE: `git pull` writes a new file and renames it into place,
      # so the container keeps reading the old one forever while the host shows
      # the new content.
      #
      # It cost two "fixes" that were never loaded. Caddy reported a successful
      # reload each time — it WAS reloading, just the stale inode — and the
      # measured downtime moved around only because container boot times vary.
      #
      # Mounting the directory means a replaced file is visible immediately.
      - ../caddy:/etc/caddy:ro
      # ★ OPERATOR-ENABLED SITES — OUTSIDE THE REPO MOUNT, DELIBERATELY ★
      #
      # The Caddyfile imports /etc/caddy-sites/*.caddy. Site blocks with
      # prerequisites a deploy cannot satisfy (grims-squad.com needs its Origin
      # CA certificate pair installed first) are staged in infra/caddy/sites/
      # and copied here by the operator when they are ready to load. If this
      # directory imported from the repo mount instead, the next `git pull`
      # would load a block whose certificates do not exist and fail the whole
      # config. Docker creates the host directory empty on first up, and an
      # empty import glob is a no-op.
      - /srv/grims/caddy:/etc/caddy-sites:ro
      # The Cloudflare Origin CA pair for grims-squad.com. Empty until the
      # cutover (infra/cutover-grims-squad.md) — mounting an empty directory
      # costs nothing, and having the mount in place BEFORE the certificates
      # arrive means installing them needs no compose change, only a reload.
      - /etc/ssl/grims-squad.com:/etc/ssl/grims-squad.com:ro
      - caddy_data:/data # certificates and ACME account — MUST persist
      - caddy_config:/config
    environment:
      SITE_HOSTNAMES: ${SITE_HOSTNAMES}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on: [web, api]

  postgres:
    # Bundles BOTH TimescaleDB and pgvector. Using plain postgres here would
    # break market_history (a hypertable) and the RAG embeddings at once.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 1gb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: [/srv/grims/.env]
    # ── Reaching GMSD AI, which lives on the owner's PC ──────────────────────
    #
    # A reverse SSH tunnel binds the model endpoints to the SERVER's loopback
    # (see tools/gmsd-tunnel.cmd). A container has its own network namespace, so
    # `127.0.0.1` inside here is the container itself — the tunnel is invisible
    # from in here without this line.
    #
    # `host-gateway` resolves to the docker host, so AI_BASE_URL in production is
    # `http://host.docker.internal:11434/v1`.
    #
    # WORTH CORRECTING A CLAIM MADE EARLIER: the AI contract said this value was
    # identical on a laptop and on the server, "one value, one code path". That
    # was true only while nothing had to cross a container boundary. It differs by
    # HOST and by nothing else — same scheme, same ports, same paths — and the
    # code still has no environment branching in it.
    #
    # The tunnel deliberately does NOT bind 0.0.0.0. Publishing an unauthenticated
    # model endpoint to the internet is the one mistake that would matter here.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      API_PORT: 5001
      API_HOST: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }
    healthcheck:
      # Uses the real health endpoint, so an unhealthy dependency is visible in
      # `docker ps` rather than only in the logs.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5001/v1/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://45-63-35-93.sslip.io}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # ★ WITHOUT THIS, NOTHING SIGNED-IN WORKS ★
      #
      # A React Server Component runs INSIDE this container, where
      # `localhost:5001` is this container — and nothing listens there. The API
      # is a sibling service reachable by its compose name.
      #
      # It was missing, so `lib/api.ts` fell back to its localhost default and
      # every server-side call died with ECONNREFUSED. That path deliberately
      # swallows failures and returns null so a broken API cannot take the whole
      # site down — which meant every authenticated page rendered its SIGNED-OUT
      # state instead. The site answered 200 throughout and looked fine; signing
      # in appeared to do nothing.
      #
      # It works locally because there the API really is on localhost:5001,
      # which is exactly why this survived until production.
      API_INTERNAL_URL: http://api:5001
      # Baked into the build: og:image must be an absolute URL a social crawler
      # can actually reach, and Next resolves it at build time.
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://45-63-35-93.sslip.io}
    depends_on: [api]

  bot:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bot
    restart: unless-stopped
    env_file: [/srv/grims/.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    # No ports. The bot dials OUT to Discord's gateway and never accepts a
    # connection, so exposing anything would only add attack surface.

  # ★ NOT A LONG-RUNNING SERVICE ★
  #
  # `docker compose up` must never start this. Every scheduled job is a one-shot
  # process launched by the host's cron:
  #
  #   docker compose run --rm worker node apps/worker/dist/inara-sync.js
  #
  # `profiles:` is what keeps it out of `up`: a service with a profile is only
  # created when that profile is named, and `run` names its service explicitly.
  # Without it, `up -d` would start the container, the entrypoint would exit
  # non-zero, and `restart: unless-stopped` would restart it forever.
  #
  # There is deliberately no `restart:` for the same reason. A job that fails
  # should be visible in cron's mail, not retried in a loop against Inara.
  # ── The resident worker ────────────────────────────────────────────────────
  #
  # Long-running, unlike `worker` below. It LISTENs on a Postgres channel and runs an ingest when
  # the training page's "Run now" button asks for one.
  #
  # ★ WHY THIS EXISTS RATHER THAN THE API DOING IT ★
  #
  # The ingests are containers. The API has no Docker socket, and giving a web-facing service the
  # ability to start containers is a far larger decision than a refresh button warrants. This has no
  # ports and no ingress — it only listens to the database.
  #
  # `restart: unless-stopped` because a button that silently does nothing is worse than no button:
  # if this is down, requests are discarded and the page will say "requested" for ever.
  worker-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    command: ['node', 'apps/worker/dist/daemon.js']
    env_file: [/srv/grims/.env]
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }

  # ── The EDDN collector ─────────────────────────────────────────────────────
  #
  # Subscribes to the public EDDN relay and keeps `market_entries` current between nightly Spansh
  # rebuilds. Roughly one market snapshot a second, from every player running an uploader.
  #
  # ★ EXACTLY ONE, AND THE SCALE FIELD IS NOT THE THING ENFORCING IT ★
  #
  # Two collectors would both write every station, interleaving two delete-and-insert transactions
  # over the same rows. `deploy.replicas: 1` states the intent; the guarantee is a Postgres advisory
  # lock inside the process, because a second one started by hand during a deploy would not consult
  # this file.
  #
  # ★ NO PORTS, NO INGRESS, OUTBOUND ONLY ★
  #
  # It connects out to tcp://eddn.edcd.io:9500 and to Postgres. Nothing reaches it.
  #
  # `restart: unless-stopped` because a dead subscriber is invisible: prices simply stop being
  # current, with no error anywhere. The training page's one-hour deadline is the alarm for that,
  # and this is what makes the alarm rare enough to be worth reading.
  eddn-collector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.eddn-collector
    env_file: [/srv/grims/.env]
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # SIGTERM closes the current reporting window before exiting, so an ordinary redeploy does not
    # leave a row the training page would report as a stall. Given room to finish that write.
    stop_grace_period: 20s
    deploy:
      replicas: 1
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    profiles: ['jobs']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [/srv/grims/.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  meilidata:
  caddy_data:
  caddy_config:

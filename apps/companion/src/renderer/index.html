<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Grim's Squad Hub</title>
    <style>
      @font-face {
        font-family: 'Orbitron';
        src: url('fonts/Orbitron-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }

      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070b0e;
        color: #e8eef2;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 14px;
      }

      #root { height: 100%; }

      /* Scrollbars that belong to this window rather than to Windows. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Range inputs pick up the accent rather than the platform blue. */
      input[type='range'] { accent-color: #3fd0d4; width: 100%; }
      input[type='checkbox'] { accent-color: #3fd0d4; }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #3fd0d4;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>

# Packaging for every platform a member might play Elite on.
#
# ★ WHAT "SUPPORTS MAC" ACTUALLY MEANS HERE ★
#
# Elite Dangerous has no native macOS build — Frontier discontinued the Mac
# client in 2015. Mac players run it through CrossOver or Whisky, so their
# journals sit inside a Wine bottle. This app runs natively on macOS and reads
# the journals out of that bottle; it is not pretending the game is native.
#
# Linux is the same story with Proton.
#
# So all three targets are built, and the journal path resolver knows where to
# look on each (packages/shared/src/journal/journal-paths.ts).

appId: org.pyrax.grimssquad.companion
productName: Grims Squad Companion

# ★ THE BINARY'S NAME, SET EXPLICITLY ★
#
# Without this electron-builder derives it from the package name — `@grims/companion`
# — and strips the punctuation to `@grimscompanion`. Windows and macOS tolerate
# that; Linux does not, and AppImage refuses outright:
#
#   executableName contains characters that cannot be safely used in file paths
#
# So two of three platforms packaged and the third failed, on a name nobody had
# chosen and no file anywhere was supposed to be called.
executableName: grims-squad-companion
copyright: Grim's Squad

directories:
  output: release
  # electron-builder reads build/icon.png from here for the app icon, the
  # taskbar icon and the installer icon on every platform — one 512px squadron
  # badge, converted per target rather than maintained three times.
  buildResources: build

files:
  - dist/**/*
  - package.json

# ---------------------------------------------------------------- Windows
# Where almost every member is. NSIS gives a normal installer that a
# non-technical player recognises rather than a zip they have to reason about.
win:
  # ★ THE .ico, NOT THE PNG ★
  #
  # There was no .ico, so electron-builder handed Windows one 512x512 PNG and
  # let it downscale to the 16px a title bar needs. That single collapse is what
  # made every icon look smeared.
  #
  # build/icon.ico packs the brand set at 32/48/64/128/256 so Windows picks the
  # nearest size instead of resampling from the largest. Generated by
  # make-icons.mjs during the build, so it cannot drift from the brand.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Elite runs on x64. An arm64 Windows build would be a download that cannot
  # find a game, which is worse than not offering it.

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No desktop shortcut by default. It is a background agent, not something
  # anybody wants to launch twice a day, and an unrequested icon reads as junk.
  createDesktopShortcut: false
  createStartMenuShortcut: true

# ------------------------------------------------------------------- macOS
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  # Both architectures: a Mac running Elite through CrossOver is as likely to
  # be Apple Silicon as Intel, and Rosetta is not something to make somebody
  # discover on their own.
  #
  # NOT notarized yet. Gatekeeper will warn until it is, and pretending
  # otherwise would leave members meeting a scary dialog with no explanation.
  # The download page has to say so plainly until an Apple Developer ID exists.
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  # A plain drag-to-Applications window. Anything cleverer is one more thing to
  # go wrong on a platform where the game itself does not officially run.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ------------------------------------------------------------------- Linux
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  # AppImage rather than deb/rpm: it runs on any distribution without a package
  # manager argument, and Linux players of a Windows game are already used to
  # the format.

# Auto-update, through our own API.
#
# * A GENERIC PROVIDER, NOT GITHUB *
#
# electron-updater fetches `latest.yml` from this base and then the installer beside it. Our
# release endpoint already serves assets by basename, so both requests land on infrastructure we
# already run — no GitHub releases, no second place for builds to live, and nothing about the
# update path that a member's network is more likely to block than the app itself.
#
# `latest.yml` is produced by electron-builder at pack time and must be uploaded to the release
# bucket alongside the installer. Without it the updater finds nothing and silently reports no
# update, which is the failure mode the old comment here was rightly worried about.
publish:
  provider: generic
  url: https://45-63-35-93.sslip.io/v1/companion/download
  # Not a channel we publish to; it just has to match what the client asks for.
  channel: latest

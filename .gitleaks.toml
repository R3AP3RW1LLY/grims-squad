# gitleaks configuration
#
# The default rule set is inherited in full. Nothing here weakens detection of an
# actual credential — the only allowlist is for one value that is provably not one.

[extend]
useDefault = true

[[rules]]
# Discord BOT TOKENS are real secrets and the default rules must keep catching them.
# Re-declared explicitly so a future edit to this file cannot quietly drop it.
id = "discord-bot-token"
description = "Discord bot token"
regex = '''[MNO][a-zA-Z0-9_-]{23,25}\.[a-zA-Z0-9_-]{6}\.[a-zA-Z0-9_-]{27,}'''
keywords = ["discord"]

[allowlist]
description = """
The squadron's Discord GUILD ID (server ID) appears in ssot/STATUS.md and in the
project's own documentation, and it is not a secret:

  - Every member of the server can read it from the Discord client in two clicks.
  - It grants nothing. Without a bot token it cannot be used to read, write, or
    join anything.
  - It is deliberately recorded in the SSOT because P1's role mapping needs it,
    and burying it in an untracked file would make the SSOT incomplete.

gitleaks' generic `discord-client-id` rule matches any 17-20 digit number, so it
cannot distinguish a guild ID from a leaked OAuth client ID. This allowlist is
scoped to that ONE literal value rather than to the rule, so a genuine Discord
client ID or bot token is still caught.

It also cannot be removed from history for free: it was committed in bffa756 and
history is distributed. Rewriting published history to scrub a non-secret would
be disproportionate and would break every existing clone.

If this value ever DOES become sensitive, the correct response is to move the
server, not to edit this file.
"""

regexes = [
  # The guild (server) ID.
  '''801929816596152320''',

  # ---------------------------------------------------------------------------
  # Discord ROLE ids for the six leadership roles, recorded in
  # ssot/02-domain/discord-roles.yaml because INV-008 requires them to live in
  # DATA rather than in source.
  #
  # A role id is not a credential. Every member of the server can read it from
  # the Discord client, and it grants nothing at all without a bot token.
  #
  # gitleaks' `discord-client-id` rule matches any 17-20 digit number NEAR the
  # word "discord". Two dozen role ids already sat in that file untouched; these
  # six tripped it only because the key is spelled `discordRoleId`, which puts
  # the keyword next to the number.
  #
  # Listed as LITERALS rather than allowlisting the file, deliberately. A path
  # allowlist would exempt that file from every rule, so a bot token pasted into
  # it — which IS a credential, and has a completely different shape — would go
  # unnoticed. The cost is that a future role id added with a `discord*` key
  # needs adding here too; that is a real maintenance tax, accepted so the file
  # keeps being scanned for actual secrets.
  '''804027885081591818''',   # Galactic Admiral (Community Leader)
  '''1512912541771235601''',  # Prime Legate
  '''1512912750416760892''',  # Chief Fleet Commander
  '''1513748632963387523''',  # First Commander
  '''1513749464458723469''',  # Sector Overseer
  '''1513669809756311593''',  # Squadron Leader
]

paths = [
  # Documentation of the taxonomy itself, which quotes example patterns.
  '''ssot/09-runbooks/secrets-rotation\.md''',
  '''\.gitleaks\.toml''',
]

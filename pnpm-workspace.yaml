packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools'

# ★ BOTH KEYS ARE HERE ON PURPOSE ★
#
# `allowBuilds` carries EXPLICIT booleans. When pnpm meets a build script with
# no decision recorded it rewrites this block with every entry set to the string
# "set this to true or false" — and while that placeholder is present it ignores
# EVERY build script, including ones already approved. The symptom is unrelated
# packages breaking all at once, and CI failing on a fresh --frozen-lockfile
# install while a warm local tree keeps working.
#
# Deleting the block does not help: the next install writes it again. Answering
# it does. That is what the booleans below are.
#
# `onlyBuiltDependencies` is the older key and is kept in step with it, so the
# policy is the same whichever one a given pnpm version reads. esbuild is a
# vitest dependency and needs its postinstall to produce a usable binary.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  # Downloads the Chromium runtime (~100MB). Without it the package installs
  # but there is no binary, and the failure reads as "electron is not a
  # command" rather than as a blocked install script.
  electron: true
  # DECLINED, deliberately. electron-winstaller builds Squirrel installers; our
  # Windows target is NSIS (apps/companion/electron-builder.yml), so its
  # postinstall fetches tooling we never invoke. `false` is a real answer and
  # stops pnpm asking — leaving it blank re-triggers the placeholder state that
  # disables every OTHER build script too.
  electron-winstaller: false
  # DECLINED, deliberately. zeromq ships prebuilt bindings for every platform we
  # run on — win32-x64 for development, linux-x64 in the collector image — and
  # `import('zeromq')` was verified to resolve `Subscriber` on both without its
  # build script ever running.
  #
  # `true` would mean compiling libzmq from source, which needs a C++ toolchain
  # that node:24-slim does not carry: the image would have to grow build-essential
  # to produce a binary identical to the prebuild it already had.
  #
  # The risk `false` accepts is a platform with no prebuild failing at `import`
  # rather than at install. Dockerfile.eddn-collector closes that: it loads the
  # module during the build and fails there, not in production.
  zeromq: false
  # DECLINED, deliberately, and for the same reason as zeromq. koffi is what lets the companion ask
  # Windows which window is in front, so the overlays can hide when the game is minimised. It ships
  # PREBUILT binaries for win32 x86/x64/ARM64, linux glibc and musl, macOS x64 and ARM64, FreeBSD
  # and OpenBSD — its own documentation is explicit that it installs without a C++ compiler.
  #
  # Verified rather than assumed: `koffi.load('user32.dll')` was called with the build script
  # blocked and returned a working foreground reading (10,000 samples in 16ms) before this line was
  # written.
  #
  # `true` would mean compiling from source and adding a toolchain requirement to every developer
  # machine and to CI, to produce a binary identical to the prebuild already on disk.
  koffi: false

onlyBuiltDependencies:
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@nestjs/core"
  # Electron's postinstall downloads the Chromium runtime (~100MB). Without it
  # the package installs but there is no binary to run, and the failure appears
  # as "electron is not a command" rather than as a blocked install script.
  #
  # Approved deliberately: it is a first-party postinstall from a
  # widely-audited project, and it is the only way the app can exist.
  - electron
  # sharp builds native image bindings, used by the brand-asset pipeline.
  - sharp

# Transitive advisory: brace-expansion <=5.0.7 (DoS via unbounded expansion).
# Reached only through eslint -> minimatch, i.e. dev-time tooling, never runtime.
# Overridden rather than ignored: a suppressed advisory is one nobody revisits.
overrides:
  brace-expansion@<5.0.8: ">=5.0.8"
  # CRITICAL (GHSA-72c6-fx6q-fr5w): @fastify/middie <=9.3.1 allows middleware
  # authentication bypass in child plugin scopes. Reached transitively via
  # @nestjs/platform-fastify - i.e. it sits directly under the request path that
  # P1's auth guards will run in. Not deferrable.
  "@fastify/middie@<9.3.2": ">=9.3.2"
  # All transitive, all with patches available, several in the request path.
  # Overridden rather than ignored - a suppressed advisory is one nobody revisits.
  "fastify@<5.7.2": ">=5.7.2" # Content-Type tab char bypasses body validation
  "fast-uri@<3.1.1": ">=3.1.1" # path traversal via percent-encoded dot
  "find-my-way@<9.6.1": ">=9.6.1" # HTTP/2 DoS
  "postcss@<8.5.12": ">=8.5.12" # arbitrary file read
  "sharp@<0.35.0": ">=0.35.0" # inherited libvips CVEs
  # CRITICAL: node-tar decompression/parse DoS via unlimited input. Reached only
  # through electron-builder -> app-builder-lib -> @electron/rebuild -> node-gyp,
  # i.e. BUILD tooling that never runs on a member's machine or on the server.
  # Overridden anyway rather than ignored: a suppressed advisory is one nobody
  # revisits, and "it is only the build" is exactly what gets said about supply
  # chain compromises before they matter.
  "tar@<7.5.19": ">=7.5.19"
  # electron-updater: cross-origin redirect leaks credentials, and uncontrolled
  # search path elements. BUILD tooling again — it never ships to a member —
  # but pinned so a future electron-builder cannot quietly drag an old copy back.
  "builder-util-runtime@<9.7.0": ">=9.7.0"
  "app-builder-lib@<26.15.0": ">=26.15.0"
